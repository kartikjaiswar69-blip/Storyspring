{% extends "base.html" %}


{% block title %}

Edit Story - StorySpring

{% endblock %}



{% block content %}

<section class="create-story-section">

    <div class="container">


        <div class="create-story-heading">

            <span>
                ✏️ STORYSPRING CREATOR
            </span>

            <h1>
                Edit Your Story
            </h1>

            <p>
                Make changes to your adventure and save them.
            </p>

        </div>



        <div class="create-story-form-card">

            <form
                method="POST"
                action="{{ url_for('edit_story', story_id=story.id) }}">


                <!-- Title -->

                <div class="story-form-group">

                    <label for="title">

                        <i class="bi bi-book"></i>

                        Story Title

                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ story.title }}"
                        maxlength="150"
                        required>

                </div>



                <!-- Description -->

                <div class="story-form-group">

                    <label for="description">

                        <i class="bi bi-card-text"></i>

                        Short Description

                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="3"
                        maxlength="300"
                        required>{{ story.description }}</textarea>

                </div>



                <!-- Category + Age -->

                <div class="row">


                    <div class="col-md-6">

                        <div class="story-form-group">

                            <label for="category">

                                <i class="bi bi-tags-fill"></i>

                                Category

                            </label>

                            <select
                                id="category"
                                name="category"
                                required>

                                <option value="Animals"
                                    {% if story.category == "Animals" %}selected{% endif %}>
                                    🐻 Animals
                                </option>

                                <option value="Magic"
                                    {% if story.category == "Magic" %}selected{% endif %}>
                                    🪄 Magic
                                </option>

                                <option value="Adventure"
                                    {% if story.category == "Adventure" %}selected{% endif %}>
                                    🚀 Adventure
                                </option>

                                <option value="Friendship"
                                    {% if story.category == "Friendship" %}selected{% endif %}>
                                    ❤️ Friendship
                                </option>

                                <option value="Nature"
                                    {% if story.category == "Nature" %}selected{% endif %}>
                                    🌳 Nature
                                </option>

                                <option value="Bedtime"
                                    {% if story.category == "Bedtime" %}selected{% endif %}>
                                    🌙 Bedtime
                                </option>

                                <option value="Fantasy"
                                    {% if story.category == "Fantasy" %}selected{% endif %}>
                                    🐉 Fantasy
                                </option>

                            </select>

                        </div>

                    </div>



                    <div class="col-md-6">

                        <div class="story-form-group">

                            <label for="age_group">

                                <i class="bi bi-people-fill"></i>

                                Age Group

                            </label>

                            <select
                                id="age_group"
                                name="age_group"
                                required>

                                <option value="3–5 Years"
                                    {% if story.age_group == "3–5 Years" %}selected{% endif %}>
                                    3–5 Years
                                </option>

                                <option value="6–8 Years"
                                    {% if story.age_group == "6–8 Years" %}selected{% endif %}>
                                    6–8 Years
                                </option>

                                <option value="7–10 Years"
                                    {% if story.age_group == "7–10 Years" %}selected{% endif %}>
                                    7–10 Years
                                </option>

                                <option value="8–12 Years"
                                    {% if story.age_group == "8–12 Years" %}selected{% endif %}>
                                    8–12 Years
                                </option>

                                <option value="10–12 Years"
                                    {% if story.age_group == "10–12 Years" %}selected{% endif %}>
                                    10–12 Years
                                </option>

                            </select>

                        </div>

                    </div>

                </div>



                <!-- Story -->

                <div class="story-form-group">

                    <label for="content">

                        <i class="bi bi-pencil-fill"></i>

                        Your Story

                    </label>

                    <p class="story-form-help">

                        Separate paragraphs with a blank line.

                    </p>

                    <textarea
                        id="content"
                        name="content"
                        rows="18"
                        required>{{ story.content|striptags }}</textarea>

                </div>



                <!-- Buttons -->

                <div class="story-form-actions">

                    <a
                        href="{{ url_for('creator_dashboard') }}"
                        class="cancel-story-button">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="publish-story-button">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Changes

                    </button>

                </div>


            </form>

        </div>

    </div>

</section>

{% endblock %}
